<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Favicon do Premium Member.
       Diamante, e nao as letras "PM": a 16px, que e o tamanho real na guia do
       navegador, duas letras viram dois borroes. Uma forma geometrica cheia
       continua reconhecivel em qualquer tamanho. -->
  <defs>
    <linearGradient id="pm-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffeaa0"/>
      <stop offset="0.55" stop-color="#e3bb55"/>
      <stop offset="1" stop-color="#c8992f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0c"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#2b2c35" stroke-width="1.5"/>
  <path d="M32 11 52 32 32 53 12 32Z" fill="url(#pm-gold)"/>
  <path d="M32 20.5 43.5 32 32 43.5 20.5 32Z" fill="#0a0a0c" opacity="0.88"/>
  <path d="M32 26.5 37.5 32 32 37.5 26.5 32Z" fill="url(#pm-gold)"/>
</svg>
